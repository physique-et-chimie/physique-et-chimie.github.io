<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Somme de sinusoïdes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  body {
    margin: 0;
    background: #f4f4f4;
    font-family: Arial;
    text-align: center;
  }
  .controls {
    margin-top: 10px;
  }
  label {
    margin-right: 10px;
  }
</style>
</head>
<body>

<h2>Somme de deux sinusoïdes</h2>

<div class="controls">
  <label>Amplitude :
    <input type="range" id="amp" min="0" max="2" step="0.1" value="1">
  </label>

  <label>Période :
    <input type="range" id="period" min="0.5" max="4" step="0.1" value="2">
  </label>

  <label>Phase :
    <input type="range" id="phase" min="0" max="6.28" step="0.1" value="0">
  </label>
</div>

<script>
let A1 = 1;
let T1 = 2;

function setup() {
  createCanvas(900, 400);
}

function draw() {
  background(240);
  translate(0, height/2);

  let A2 = parseFloat(document.getElementById("amp").value);
  let T2 = parseFloat(document.getElementById("period").value);
  let phi = parseFloat(document.getElementById("phase").value);

  stroke(0, 0, 200);
  strokeWeight(2);
  noFill();
  beginShape();
  
  for (let x = 0; x < width; x++) {
    let t = map(x, 0, width, 0, 10);
    let y = A1 * sin(TWO_PI/T1 * t)
          + A2 * sin(TWO_PI/T2 * t + phi);
    vertex(x, -100*y);
  }
  
  endShape();
}
</script>

</body>
</html>
